version: "3.8"

services:
  web:
    image: roseline_web:latest
    build: .
    restart: unless-stopped
    networks:
      - RenaceNet
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
      restart_policy:
        condition: on-failure
      labels:
        # 1. Catch HTTP requests and route them (HTTP to HTTPS is handled globally by Traefik entrypoints)
        - "traefik.enable=true"
        - "traefik.http.routers.roseline_web.entrypoints=web"
        - "traefik.http.routers.roseline_web.rule=Host(`theroselineeffect.shop`) || Host(`www.theroselineeffect.shop`)"
        
        # 2. Catch HTTPS requests and resolve certificates
        - "traefik.http.routers.roseline_web-secure.entrypoints=websecure"
        - "traefik.http.routers.roseline_web-secure.rule=Host(`theroselineeffect.shop`) || Host(`www.theroselineeffect.shop`)"
        - "traefik.http.routers.roseline_web-secure.tls=true"
        - "traefik.http.routers.roseline_web-secure.tls.certresolver=letsencryptresolver"
        
        # 3. Canonical domain redirect middleware (www -> non-www)
        - "traefik.http.middlewares.roseline-www-redirect.redirectregex.regex=^https?://www.theroselineeffect.shop/(.*)"
        - "traefik.http.middlewares.roseline-www-redirect.redirectregex.replacement=https://theroselineeffect.shop/$${1}"
        - "traefik.http.middlewares.roseline-www-redirect.redirectregex.permanent=true"
        
        # 4. Attach middleware to both routers
        - "traefik.http.routers.roseline_web.middlewares=roseline-www-redirect"
        - "traefik.http.routers.roseline_web-secure.middlewares=roseline-www-redirect"
        
        # 5. Service declaration
        - "traefik.http.services.roseline_web-svc.loadbalancer.server.port=3000"

networks:
  RenaceNet:
    external: true
